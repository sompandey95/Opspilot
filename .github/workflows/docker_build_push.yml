name: Build & Push Docker Images

# Builds the app and mock-order-service images and pushes them to GHCR.
# This is the artifact a deploy step (or a person doing it by hand) pulls —
# it does not deploy anywhere itself, since where/how to deploy is
# infra-specific and not decided in this repo.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "mock_services/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "mock_services/order_service/Dockerfile"
  workflow_dispatch: {}

concurrency:
  group: docker-build-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: app
            dockerfile: Dockerfile
          - image: mock-order-service
            dockerfile: mock_services/order_service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

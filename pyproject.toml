[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "Evaluated AI support agent with hybrid RAG and human approval controls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "asyncpg",
    "sqlalchemy[asyncio]",
    "redis[hiredis]",
    "chromadb==1.5.9",
    "openai",
    "tiktoken",
    "rank-bm25",
    "sentence-transformers",
    "alembic",
    "httpx",
    "jsonschema",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff==0.12.11",
]

[project.urls]
Repository = "https://github.com/sompandey95/Opspilot"
Documentation = "https://github.com/sompandey95/Opspilot/tree/main/docs"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma:1.5.9
    ports:
      - "8100:8000"
    volumes:
      - chromadata:/chroma/chroma

  mock-order-service:
    build:
      context: .
      dockerfile: mock_services/order_service/Dockerfile
    ports:
      - "8001:8001"

volumes:
  pgdata:
  chromadata:
